[project]
name = "security_case_study_mcp"
version = "0.1.0"
description = "security_case_study_mcp using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.2"
]

[project.scripts]
security_case_study_mcp = "security_case_study_mcp.main:run"
run_crew = "security_case_study_mcp.main:run"
train = "security_case_study_mcp.main:train"
replay = "security_case_study_mcp.main:replay"
test = "security_case_study_mcp.main:test"
run_with_trigger = "security_case_study_mcp.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
